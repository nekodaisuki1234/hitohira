<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf0e8"><meta name="description" content="次の小さな一歩を、カードにまかせて。ブラウザだけで使える行動カード。"><title>ひとひら — 次の一歩を、1枚から。</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><header><a class="brand" href="./"><span class="brand-icon">❋</span> ひとひら</a><button id="settings" class="icon-button" aria-label="設定を開く">⚙</button></header>
<main id="main"><div class="intro"><p class="eyebrow">A LITTLE MOMENT FOR YOU</p><h1>次の一歩を、<br>1枚から。</h1><p>考えるのは、ちょっとお休み。<br>今のあなたに合う、小さな行動を。</p></div>
<div class="context"><span id="contextText"></span><button id="contextSettings">変更</button></div>
<section id="card" class="card" aria-live="polite"></section><div id="actions" class="actions"></div><p id="message" class="message" role="status"></p><p class="daily" id="daily"></p><footer>自分のペースで、ひとつずつ。</footer></main>
<section id="settingsPanel" hidden><button id="back" class="text-button">← カードに戻る</button><h1>あなたに合わせて</h1><p>今の状況と、カードの設定。</p><form id="form"><fieldset><legend>今いる場所</legend><div class="choices"><label><input type="radio" name="place" value="home"> おうち</label><label><input type="radio" name="place" value="out"> 外出中</label></div></fieldset><fieldset><legend>今の気分</legend><div class="choices"><label><input type="radio" name="energy" value="okay"> 元気</label><label><input type="radio" name="energy" value="tired"> 疲れ気味</label></div></fieldset><label class="boundary">生活日の区切り <select name="boundary"><option value="0">午前0時</option><option value="3">午前3時</option><option value="4">午前4時</option><option value="5">午前5時</option><option value="6">午前6時</option></select></label><h2>カードを整える</h2><p class="help">時間帯は開始を含み、終了を含みません。開始と終了が同じ場合は終日です。生活習慣は対象時間帯ごとに1回。23〜4時は「寝る準備」のみ抽選します。</p><div id="editors"></div><button class="primary" type="submit">設定を保存</button><p id="formError" role="alert"></p></form><p class="help">記録はこのブラウザ内だけに保存します。位置情報や外部AIは使いません。他のアプリの終了・利用制限は行いません。</p></section></div><script type="module" src="app.js"></script></body></html>
